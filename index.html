<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق القسم – نموذج تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F3FAFE;
  --ink:#1B3A4F;
  --ink-2:#55707F;
  --line:#D3EAF6;
  --primary:#0277BD;
  --primary-ink:#FFFFFF;
  --primary-soft:#E1F5FE;
  --head-bg:#E1F5FE;
  --head-ink:#01579B;
  --alert:#B42318;
  --alert-soft:#FDE8E6;
  --amber:#9A4A06;
  --amber-soft:#FCEFD9;
  --ok:#1D6B3A;
  --ok-soft:#E1F2E6;
  --board:#E1F5FE;
  --board-ink:#01579B;
  --shadow:0 1px 3px rgba(2,119,189,.08);
  --font:"IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.demo{background:var(--amber-soft);color:var(--amber);font-size:13px;padding:6px 16px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--head-bg);color:var(--head-ink);padding:0 12px;display:flex;align-items:center;gap:10px;height:64px}
.top h1{font-size:18px;margin:0;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{border-bottom:1px solid #B3E5FC}
.top .iconbtn,.top .rolebtn{background:#FFFFFF;border-color:#B3E5FC;color:var(--head-ink)}
.top .grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.rolebtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:44px;white-space:nowrap}

main{flex:1;padding:14px 14px 110px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;cursor:pointer;font-weight:500;min-height:44px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.search input{border:0;outline:0;background:transparent;padding:12px 0;width:100%}

/* bed token – the ward board */
.bed{flex:none;min-width:56px;height:56px;border-radius:10px;background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;padding:0 6px}
.bed small{font-size:10px;opacity:.75;line-height:1}
.bed b{font-size:19px;line-height:1.2;letter-spacing:.5px;direction:ltr}
.bed.lg{min-width:72px;height:72px;border-radius:12px}
.bed.lg b{font-size:24px}
.bed.off{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--line)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:start;width:100%;cursor:pointer}
.row .info{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16px}
.row .meta{font-size:13px;color:var(--ink-2)}
.row .blk{display:block}
.row .dx{display:block;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .name,.row .meta{display:inline}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:500;white-space:nowrap}
.tag.alert{background:var(--alert-soft);color:var(--alert)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.muted{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.empty{text-align:center;color:var(--ink-2);padding:40px 16px}

.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--primary);color:var(--primary-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:600;box-shadow:0 4px 14px rgba(2,119,189,.28);cursor:pointer;display:flex;gap:8px;align-items:center;z-index:4}
.fab svg{width:20px;height:20px}

/* patient header */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:flex-start}
.phead .name{font-size:20px;font-weight:700;line-height:1.35}
.phead .meta{font-size:14px;color:var(--ink-2)}
.allergy{margin-top:10px;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:600;background:var(--alert);color:#fff}
.allergy svg{width:20px;height:20px;flex:none}
.allergy.none{background:var(--surface-2);color:var(--ink-2);font-weight:400;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px -14px 12px;padding:8px 14px;scrollbar-width:none;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:var(--ground)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tabs .n{font-size:12px;background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;margin-inline-start:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--ink-2);font-weight:600}
.card p{margin:0;white-space:pre-wrap}
.dl{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:8px 14px;margin:0}
.dl dt{color:var(--ink-2);font-size:14px}
.dl dd{margin:0;white-space:pre-wrap}
.dl dd.none{color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.block{width:100%}

.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vcell{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.vcell small{display:block;font-size:12px;color:var(--ink-2)}
.vcell b{font-size:20px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.vcell.bad{background:var(--alert-soft)}
.vcell.bad b{color:var(--alert)}
.vlist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.vlist th{font-weight:500;color:var(--ink-2);text-align:start;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.vlist td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.vlist td.bad{color:var(--alert);font-weight:700}
.scroll{overflow-x:auto}

.tl{position:relative;padding-inline-start:18px}
.tl::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .item{position:relative;margin-bottom:12px}
.tl .item::before{content:"";position:absolute;inset-inline-start:-17px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.when{font-size:13px;color:var(--ink-2)}

.order .top-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.order .kind{font-weight:700}
.order .req{background:var(--surface-2);border-radius:10px;padding:10px;margin:8px 0}
.order .resp{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:84px;height:84px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.file{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);padding:6px;text-align:center;cursor:default}
.thumb.file b{font-size:14px;color:var(--alert)}

/* login */
.hero{padding:28px 6px 10px}
.hero h2{font-size:26px;margin:0 0 6px;line-height:1.3}
.hero p{margin:0;color:var(--ink-2)}
.roles{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.role{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:start;width:100%}
.role .ic{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.role .ic svg{width:26px;height:26px}
.role b{display:block;font-size:17px}
.role span{font-size:14px;color:var(--ink-2)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:19px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-2)}
.field.err input{border-color:var(--alert)}
.errmsg{color:var(--alert);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:40px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
details.more summary{cursor:pointer;font-weight:600}
.sheet-actions{display:flex;gap:8px;margin-top:8px}
.sheet-actions .btn{flex:1}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:14px}
.qbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -2px 12px rgba(15,36,64,.07)}
.qbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;cursor:pointer;color:var(--primary);font-size:13px;font-weight:600;border-radius:12px}
.qbar button:active{background:var(--primary-soft)}
.qbar svg{width:26px;height:26px}
.pick{display:grid;gap:10px;margin-bottom:8px}
.pick .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;font-size:18px}
.pick svg{width:24px;height:24px}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-size:14px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
.tgroup h4{margin:12px 0 6px;font-size:14px;color:var(--ink-2);font-weight:600}
.tgroup:first-child h4{color:var(--primary)}
.tgroup .chips{margin-bottom:4px}
.tsel{position:sticky;top:-16px;z-index:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.tsel.on{background:var(--primary-soft);color:var(--head-ink);font-weight:600;border-color:#B3E5FC}
.chip[hidden],.tgroup[hidden]{display:none}
.btn svg{width:20px;height:20px;vertical-align:-5px;margin-inline-end:6px}
.field[hidden]{display:none}
.flabel{font-size:14px;font-weight:500;margin:0 0 6px}
.by{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.by span:first-child{font-weight:600;color:var(--head-ink)}
.vlist td.who{color:var(--ink-2);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <div class="demo" role="note">نموذج للعرض: كل البيانات وهمية، وأي تعديل بيروح لما تسكّر الصفحة.</div>
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW = Date.now();
const H = 3600e3, D = 24*H;
const fmtDT = new Intl.DateTimeFormat('ar-u-nu-latn', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtD = new Intl.DateTimeFormat('ar-u-nu-latn', {day:'numeric', month:'long', year:'numeric'});
const dt = t => fmtDT.format(new Date(t));
const d = t => fmtD.format(new Date(t));
function ago(t){
  const m = Math.round((Date.now()-t)/60000);
  if (m < 1) return 'هلق';
  if (m < 60) return 'من ' + m + ' دقيقة';
  const h = Math.round(m/60);
  if (h < 24) return 'من ' + h + ' ساعة';
  const dd = Math.round(h/24);
  return dd === 1 ? 'مبارح' : 'من ' + dd + ' أيام';
}
function age(b){ if(!b) return null; const x = new Date(b); const n = new Date(); let a = n.getFullYear()-x.getFullYear(); if (n < new Date(n.getFullYear(), x.getMonth(), x.getDate())) a--; return a; }
const plural = (n, one, many) => (n >= 3 && n <= 10) ? many : one;
function ageText(b){
  if (!b) return null;
  const x = new Date(b), n = new Date();
  if (isNaN(x) || x > n) return null;
  const days = Math.floor((n - x) / D);
  if (days < 31) return days + ' ' + plural(days, 'يوم', 'أيام');
  let m = (n.getFullYear()-x.getFullYear())*12 + n.getMonth() - x.getMonth(); if (n.getDate() < x.getDate()) m--;
  if (m < 24) return m + ' ' + plural(m, 'شهر', 'أشهر');
  const y = age(b); return y + ' ' + plural(y, 'سنة', 'سنوات');
}
const dayNo = t => Math.floor((Date.now()-t)/D)+1;
const icon = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  steth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v5a4 4 0 008 0V3"/><path d="M10 12v3a5 5 0 0010 0v-2"/><circle cx="20" cy="11" r="2"/></svg>',
  tube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v13a2 2 0 004 0V3"/><path d="M10 11h4"/></svg>',
  xray:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 6v12M8 9h8M7.5 12h9M8 15h8"/></svg>',
  mask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9c3-2 13-2 16 0v4c0 4-4 6-8 6s-8-2-8-6z"/><path d="M8 12h8"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg>',
  nurse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/><path d="M12 5.5v5M9.5 8h5"/></svg>',
  consult:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- fake images ---------- */
function svgURI(s){ return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
function labReport(name, rows){
  const lines = rows.map((r,i)=>`<text x="370" y="${150+i*34}" font-size="18" text-anchor="end">${esc(r[0])}</text><text x="160" y="${150+i*34}" font-size="18" text-anchor="middle" font-weight="700" fill="${r[2]?'#B42318':'#15302A'}">${esc(r[1])}</text><text x="40" y="${150+i*34}" font-size="13" fill="#6B7C78">${esc(r[3]||'')}</text>`).join('');
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="${190+rows.length*34}" font-family="Tahoma, sans-serif"><rect width="100%" height="100%" fill="#fff"/><rect width="100%" height="56" fill="#0E6B5B"/><text x="370" y="36" fill="#fff" font-size="20" text-anchor="end" font-weight="700">تقرير مخبري (توضيحي)</text><text x="370" y="92" font-size="16" text-anchor="end" fill="#4A5E59">${esc(name)}</text><line x1="30" x2="370" y1="112" y2="112" stroke="#D5E0DC"/>${lines}</svg>`);
}
function xrayImg(label){

}

const BAD = {
  sys:v=>v>=160||v<90, dia:v=>v>=100||v<50, hr:v=>v>100||v<50, rr:v=>v>22||v<10,
  t:v=>v>=38||v<36, spo2:v=>v<92, glu:v=>v>200||v<70
};

/* ---------- render ---------- */
function render(){
  const v = view();
  const top = $('#top'), main = $('#main');
  if (!S.user || v.name==='login'){ top.innerHTML = `<div class="grow"><h1>تطبيق القسم</h1><div class="sub">نموذج تجريبي للعرض</div></div>`; main.innerHTML = loginView(); return; }
  const canBack = S.stack.length > 1;
  let title='', sub='';
  if (v.name==='list'){ title = DEPTS[me().dept].name; sub = me().name; }
  else if (v.name==='patient'){ const p = pById(v.id); title = p.full_name; sub = 'إضبارة ' + p.file_number; }
  else if (v.name==='queue'){ title = me().role==='lab' ? 'طلبات المخبر' : 'طلبات الأشعة'; sub = me().name; }
  else if (v.name==='order'){ const o = oById(v.id); title = (o.type==='lab'?'طلب تحليل':'طلب أشعة') + ' #' + o.id; sub = pById(o.patient).full_name; }
  top.innerHTML = `${canBack?`<button class="iconbtn" data-a="back" aria-label="رجوع">${icon.back}</button>`:''}
    <div class="grow"><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>
    <button class="rolebtn" data-a="logout">تبديل الدور</button>`;
  if (v.name==='list') main.innerHTML = listView();
  else if (v.name==='patient') main.innerHTML = patientView(pById(v.id));
  else if (v.name==='queue') main.innerHTML = queueView();
  else if (v.name==='order') main.innerHTML = orderView(oById(v.id));
}

function loginView(){
  return `<div class="hero"><h2>مين عم يستخدم التطبيق؟</h2><p>اختار دور لتشوف التطبيق متل ما رح يشوفه. بالنسخة الحقيقية كل واحد بيسجل دخول بحسابه.</p></div>
  <div class="roles">${ROLE_CARDS.map(r=>`<button class="role" data-a="login" data-id="${r.user}"><span class="ic">${icon[r.ic]}</span><span><b>${esc(r.title)}</b><span>${esc(USERS[r.user].name)} · ${esc(r.desc)}</span></span></button>`).join('')}</div>`;
}

  if (!o.full_name) errs.push('الاسم مطلوب');
  if (!o.file_number) errs.push('رقم الإضبارة مطلوب');
  else if (P.some(p => p.file_number===o.file_number && p!==existing)) errs.push('رقم الإضبارة مستعمل لمريض تاني');
  if (!o.gender) errs.push('اختار الجنس');
  if (!o.category) errs.push('اختار الصفة الاعتبارية');
  if (errs.length){ $('#ferr').textContent = errs.join('، ') + '.'; return null; }
  return o;
}

function updateTsel(){

function orderForm(type){

    <div class="chips" role="group" aria-label="الأولوية"><button class="chip" data-a="prio" data-id="normal" aria-pressed="true">عادي</button><button class="chip" data-a="prio" data-id="urgent" aria-pressed="false">إسعافي</button></div>
    ${type==='lab' ? labPicker() : area('o_text','الصورة المطلوبة','','مثلاً: صورة صدر بسيطة، إيكو بطن')}
    <div class="field"><label for="o_file">صورة مع الطلب (اختيارية)</label><input id="o_file" type="file" accept="image/*"><span class="hint">مثلاً صورة ورقة الطلب.</span></div>

/* file reading */
const pending = { order:[], respond:[], tests:new Set() };
function readFiles(input, bucket, prevSel){
  pending[bucket] = [];
  const files = [...input.files].slice(0,6);
  const prev = $(prevSel); prev.innerHTML = '';
  files.forEach(f => {
    if (f.size > 8*1024*1024){ toast('الملف ' + f.name + ' أكبر من 8 ميغا'); return; }
    if (f.type.startsWith('image/')){
      const r = new FileReader();
      r.onload = () => { pending[bucket].push({name:f.name, kind:'image', src:r.result}); prev.insertAdjacentHTML('beforeend', `<span class="thumb"><img src="${esc(r.result)}" alt="${esc(f.name)}"></span>`); };
      r.readAsDataURL(f);
    } else {
      pending[bucket].push({name:f.name, kind:'pdf'});
      prev.insertAdjacentHTML('beforeend', `<span class="thumb file"><b>PDF</b>${esc(f.name)}</span>`);
    }
  });
}

/* ---------- events ---------- */
const num = i => { const x = $('#'+i).value.trim(); return x==='' ? null : +x; };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, idv = el.dataset.id;
  if (a==='closeSheet'){ if (el.classList.contains('overlay') && e.target!==el) return; closeSheet(); return; }
  const v = view(), p = v.name==='patient' ? pById(v.id) : null;
  switch(a){
    case 'login': S.user = +idv; S.stack = [{name: homeOf(me().role)}]; S.tab='admitted'; S.search=''; S.qtab='pending'; render(); break;
    case 'logout': S.user = null; S.stack = []; render(); break;
    case 'back': back(); break;
    case 'tab': S.tab = idv; render(); break;
    case 'qtab': S.qtab = idv; render(); break;
    case 'open': S.ptab = 'file'; go({name:'patient', id:+idv}); break;
    case 'ptab': S.ptab = idv; render(); break;
    case 'openOrder': go({name:'order', id:+idv}); break;
    case 'zoom': $('#layer').innerHTML = `<div class="lightbox" data-a="closeSheet"><button class="iconbtn" style="background:transparent;border-color:#fff6" data-a="closeSheet" aria-label="إغلاق">${icon.close}</button><img src="${esc(el.dataset.src)}" alt=""></div>`; break;

    case 'addPatient': openSheet(patientForm(null)); break;
    case 'createPatient': { const o = readPatientForm(null); if(!o) return; const np = addP(Object.assign(o, {dept:me().dept, admission_date:Date.now(), created_by:me().id})); closeSheet(); S.tab='admitted'; toast('انضاف المريض'); S.ptab='file'; go({name:'patient', id:np.id}); break; }
    case 'editPatient': openSheet(patientForm(p)); break;
    case 'savePatient': { const o = readPatientForm(p); if(!o) return; Object.assign(p, o); closeSheet(); toast('انحفظت التعديلات'); render(); break; }
    case 'discharge': openSheet(`<h2>تخريج ${esc(p.full_name)}</h2>${area('d_sum','ملخص الخروج','','الحالة عند الخروج، الأدوية، موعد المراجعة')}${sheetBtns('doDischarge','تخريج المريض')}`); break;
    case 'doDischarge': p.discharge_summary = $('#d_sum').value.trim(); p.status='discharged'; p.discharged_at = Date.now(); closeSheet(); toast('خرج المريض'); render(); break;

    case 'addVitals': openSheet(vitalsForm()); break;
    case 'saveVitals': { const r = {sys:num('v_sys'), dia:num('v_dia'), hr:num('v_hr'), rr:num('v_rr'), t:num('v_t'), spo2:num('v_spo2'), glu:num('v_glu'), uo:num('v_uo'), dr:num('v_dr')}; const drn = $('#v_drn').value.trim(); if (Object.values(r).every(x=>x==null)){ $('#ferr').textContent='عبّي قيمة وحدة على الأقل.'; return; } p.vitals.push(Object.assign({id:id(), at:Date.now(), by:me().id, drn}, r)); closeSheet(); S.ptab='vitals'; toast('انحفظت القراءة'); render(); break; }
    case 'addNote': openSheet(`<h2>ملاحظة متابعة</h2>${area('n_text','الملاحظة','','وضع المريض اليوم، الفحص، الخطة')}<div id="ferr" class="errmsg" role="alert"></div>${sheetBtns('saveNote','حفظ الملاحظة')}`); break;
    case 'saveNote': { const t = $('#n_text').value.trim(); if(!t){ $('#ferr').textContent='اكتب الملاحظة أول.'; return; } p.notes.push({id:id(), at:Date.now(), by:me().id, text:t}); closeSheet(); S.ptab='notes'; toast('انحفظت الملاحظة'); render(); break; }
    case 'addProc': openSheet(procForm()); break;
    case 'pickProc': $('#pr_type').value = idv; document.querySelectorAll('[data-a="pickProc"]').forEach(c=>c.setAttribute('aria-pressed', c===el)); break;
    case 'saveProc': { const t = $('#pr_type').value.trim(); if(!t){ $('#ferr').textContent='اختار أو اكتب نوع الإجراء.'; return; } p.procedures.push({id:id(), at:Date.now(), by:me().id, type:t, notes:$('#pr_notes').value.trim()}); closeSheet(); S.ptab='proc'; toast('انسجل الإجراء'); render(); break; }

    case 'quickOrder': openSheet(`<h2>شو بدك تطلب؟</h2><div class="pick"><button class="btn primary" data-a="newOrder" data-id="lab">${icon.tube}طلب تحليل</button><button class="btn primary" data-a="newOrder" data-id="radiology">${icon.xray}طلب أشعة</button></div><div class="sheet-actions"><button class="btn" data-a="closeSheet">إلغاء</button></div>`); break;
    case 'newOrder': pending.order = []; pending.tests = new Set(); openSheet(orderForm(idv)); break;
    case 'toggleTest': { const on = !pending.tests.has(idv); on ? pending.tests.add(idv) : pending.tests.delete(idv); document.querySelectorAll('[data-a="toggleTest"]').forEach(c => { if (c.dataset.id===idv) c.setAttribute('aria-pressed', on); }); updateTsel(); break; }
    case 'addConsult': openSheet(consultForm()); break;
    case 'pickSpec': $('#c_spec').value = idv; document.querySelectorAll('[data-a="pickSpec"]').forEach(c=>c.setAttribute('aria-pressed', c===el)); $('#c_other_wrap').hidden = idv!=='other'; if (idv==='other') $('#c_other').focus(); break;
    case 'saveConsult': { const spec = $('#c_spec').value, t = $('#c_text').value.trim(), other = $('#c_other').value.trim(); const errs = []; if (!spec) errs.push('اختار الاختصاص'); if (spec==='other' && !other) errs.push('اكتب اسم الاختصاص'); if (!t) errs.push('اكتب الرأي والتوصيات'); if (errs.length){ $('#ferr').textContent = errs.join('، ') + '.'; return; } addC({patient:p.id, spec, other, consultant:$('#c_name').value.trim(), text:t, by:me().id, at:Date.now()}); closeSheet(); S.ptab='consult'; toast('انسجلت الاستشارة'); render(); break; }
    case 'prio': $('#o_prio').value = idv; document.querySelectorAll('[data-a="prio"]').forEach(c=>c.setAttribute('aria-pressed', c===el)); break;
    case 'saveOrder': { const t = $('#o_text').value.trim(); if(!t && !pending.order.length && !pending.tests.size){ $('#ferr').textContent='اختار تحليل أو اكتب الطلب أو ارفق صورة.'; return; } const type = $('#o_type').value; addO({patient:p.id, type, by:me().id, at:Date.now(), priority:$('#o_prio').value, tests:type==='lab'?[...pending.tests]:[], request_text:t, request_files:pending.order.slice()}); closeSheet(); S.ptab = type==='lab' ? 'lab' : 'rad'; toast(type==='lab'?'انبعت الطلب للمخبر':'انبعت الطلب للأشعة'); render(); break; }
    case 'cancelOrder': { const o = oById(idv); o.status='cancelled'; toast('انلغى الطلب'); render(); break; }

    case 'respond': { const o = oById(idv); const t = $('#rt').value.trim(); if(!t && !pending.respond.length){ $('#rerr').textContent='ارفق ملف النتيجة أو اكتب ملاحظة.'; return; } Object.assign(o, {status:'completed', response_text:t, response_files:pending.respond.slice(), responded_by:me().id, completed_at:Date.now(), seen:false}); pending.respond=[]; toast('انبعتت النتيجة للطبيب'); back(); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.search = e.target.value; $('#rows').innerHTML = rowsHTML(); }
  if (e.target.id==='f_birth'){ const t = ageText(e.target.value); $('#f_age').textContent = t ? 'العمر: ' + t : ''; }
  if (e.target.id==='t_search'){ const q = e.target.value.trim().toLowerCase(); const first = document.querySelector('#tlist .tgroup'); document.querySelectorAll('#tlist .tgroup').forEach(g => { let any = false; g.querySelectorAll('.chip').forEach(c => { const m = !q || c.dataset.id.toLowerCase().includes(q); c.hidden = !m; any = any || m; }); g.hidden = !any || (!!q && g === first); }); }
});
document.addEventListener('change', e => {
  if (e.target.id==='o_file') readFiles(e.target, 'order', '#oprev');
  if (e.target.id==='rf') readFiles(e.target, 'respond', '#rprev');
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#layer').innerHTML) closeSheet(); });

render();
})();
</script>
